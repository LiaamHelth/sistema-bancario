<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cajero automático – Banco Sim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
  <style>
    body { background: #0a1c30; color: #fff; }
    .cajero { max-width: 560px; margin: 0 auto; padding: 1rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    .marco { background: #13304f; border: 2px solid #2b5380; border-radius: 18px; padding: 1.25rem; }
    .pantalla { background: #04101d; border: 2px solid #1f4a78; border-radius: 10px; padding: 1.5rem; min-height: 300px; }
    .pantalla h1, .pantalla h2 { color: #fff; }
    .pantalla .form-control { background: #0b2239; border-color: #2b5380; color: #fff; font-size: 1.3rem; letter-spacing: .15em; }
    .pantalla .form-control::placeholder { color: #6c88a5; letter-spacing: normal; }
    .pantalla .form-label { color: #b8c9da; }
    .opcion { width: 100%; text-align: left; background: #0b2239; border: 1px solid #2b5380; color: #fff; border-radius: 8px; padding: .8rem 1rem; font-weight: 600; margin-bottom: .6rem; }
    .opcion:hover, .opcion:focus-visible { background: #17406a; }
    .monto-rapido { background: #0b2239; border: 1px solid #2b5380; color: #fff; }
    .monto-rapido:hover { background: #17406a; color: #fff; }
    .saldo-grande { font-size: 2.2rem; font-weight: 800; color: var(--oro); }
    .tabla-atm { color: #fff; --bs-table-bg: transparent; --bs-table-color: #fff; --bs-table-border-color: #1f4a78; font-size: .9rem; }
    .entra { color: #5ee0b0; } .sale { color: #ff8b82; }
    .pantalla .alert { margin-bottom: 1rem; }
  </style>
</head>
<body>
<main class="cajero">
  <p class="text-center mb-3"><a href="/" class="marca text-decoration-none text-white fs-5">Banco <span style="color:var(--oro)">Sim</span> · Cajero</a></p>
  <div class="marco"><div class="pantalla" id="pantalla" aria-live="polite"></div></div>
</main>

<script src="/js/comun.js"></script>
<script>
const P = document.getElementById('pantalla');
let inactividad;
let sesionActiva = false;

function reiniciarInactividad() {
  clearTimeout(inactividad);
  if (sesionActiva) inactividad = setTimeout(() => salir('Sesión cerrada por inactividad'), 60000);
}
['click', 'keydown'].forEach((e) => document.addEventListener(e, reiniciarInactividad));

const mensaje = (texto, tipo = 'danger') => `<div class="alert alert-${tipo}" role="alert">${esc(texto)}</div>`;

function pantallaLogin(aviso = '') {
  sesionActiva = false;
  P.innerHTML = `
    <h1 class="h4 mb-1">Bienvenido</h1><p class="text-secondary mb-4" style="color:#b8c9da!important">Identifícate para continuar.</p>
    ${aviso}
    <form id="fLogin" novalidate>
      <div class="mb-3"><label class="form-label" for="cuenta">Número de cuenta</label>
        <input id="cuenta" class="form-control" inputmode="numeric" maxlength="10" placeholder="10 dígitos" autocomplete="off" required></div>
      <div class="mb-4"><label class="form-label" for="pin">PIN</label>
        <input id="pin" type="password" class="form-control" inputmode="numeric" maxlength="4" placeholder="4 dígitos" autocomplete="off" required></div>
      <button class="btn btn-primary w-100 py-2">Ingresar</button>
    </form>`;
  document.getElementById('fLogin').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const numero_cuenta = document.getElementById('cuenta').value.trim(), pin = document.getElementById('pin').value.trim();
    if (!/^\d{10}$/.test(numero_cuenta)) return pantallaLogin(mensaje('El número de cuenta debe tener 10 dígitos'));
    if (!/^\d{4}$/.test(pin)) return pantallaLogin(mensaje('El PIN debe tener 4 dígitos'));
    try {
      const r = await api('/api/cajero/login', { method: 'POST', body: { numero_cuenta, pin } });
      sesionActiva = true; reiniciarInactividad(); pantallaMenu(r.nombre);
    } catch (e) { pantallaLogin(mensaje(e.message)); }
  });
}

function pantallaMenu(nombre, aviso = '') {
  if (nombre) pantallaMenu.nombre = nombre;
  P.innerHTML = `
    <h2 class="h4 mb-3">Hola, ${esc(pantallaMenu.nombre)}. ¿Qué deseas hacer?</h2>
    ${aviso}
    <button class="opcion" id="oSaldo">Consultar saldo</button>
    <button class="opcion" id="oRetiro">Retirar dinero</button>
    <button class="opcion" id="oMov">Ver últimos movimientos</button>
    <button class="opcion" id="oSalir" style="border-color:#8a3a35">Cerrar operación</button>`;
  document.getElementById('oSaldo').onclick = verSaldo;
  document.getElementById('oRetiro').onclick = () => pantallaRetiro();
  document.getElementById('oMov').onclick = verMovimientos;
  document.getElementById('oSalir').onclick = () => salir('Gracias por usar Banco Sim');
}

const volver = '<button class="btn btn-outline-light mt-3" id="bVolver">Volver al menú</button>';
const enlazarVolver = () => { document.getElementById('bVolver').onclick = () => pantallaMenu(); };

async function manejar(fn) {
  try { await fn(); }
  catch (e) {
    if (e.status === 401 || e.status === 403) { sesionActiva = false; pantallaLogin(mensaje(e.message)); }
    else pantallaMenu(null, mensaje(e.message));
  }
}

const verSaldo = () => manejar(async () => {
  const s = await api('/api/cajero/saldo');
  P.innerHTML = `<h2 class="h5">Saldo disponible</h2><div class="saldo-grande my-3">${dinero(s.saldo)}</div>
    <p class="mb-0" style="color:#b8c9da">Cuenta ${esc(s.numero_cuenta)}</p>${volver}`;
  enlazarVolver();
});

function pantallaRetiro(aviso = '') {
  P.innerHTML = `<h2 class="h5 mb-3">Retirar dinero</h2>${aviso}
    <div class="row g-2 mb-3">${[50000, 100000, 200000, 500000].map((v) => `<div class="col-6"><button class="btn monto-rapido w-100 py-2" data-v="${v}">${dinero(v)}</button></div>`).join('')}</div>
    <form id="fRetiro" novalidate><label class="form-label" for="otro">Otro valor</label>
      <div class="input-group"><input id="otro" type="number" min="1" step="any" class="form-control" placeholder="Ej: 150000">
      <button class="btn btn-primary">Retirar</button></div></form>${volver}`;
  enlazarVolver();
  P.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => retirar(Number(b.dataset.v))));
  document.getElementById('fRetiro').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = Number(document.getElementById('otro').value);
    if (!(v > 0)) return pantallaRetiro(mensaje('El valor debe ser mayor que cero'));
    retirar(v);
  });
}

async function retirar(valor) {
  if (!confirm(`¿Confirmas el retiro de ${dinero(valor)}?`)) return;
  try {
    const r = await api('/api/cajero/retiro', { method: 'POST', body: { valor } });
    P.innerHTML = `${mensaje(r.mensaje, 'success')}<p class="mb-1">Retiraste ${dinero(valor)}.</p>
      <p class="mb-0" style="color:#b8c9da">Tu nuevo saldo es</p><div class="saldo-grande">${dinero(r.saldo)}</div>${volver}`;
    enlazarVolver();
  } catch (e) {
    if (e.status === 401 || e.status === 403) { sesionActiva = false; pantallaLogin(mensaje(e.message)); }
    else pantallaRetiro(mensaje(e.message));
  }
}

const verMovimientos = () => manejar(async () => {
  const m = await api('/api/cajero/movimientos');
  P.innerHTML = `<h2 class="h5 mb-3">Últimos movimientos</h2>
    <div class="tabla-scroll"><table class="table tabla-atm table-sm"><thead><tr><th>Fecha</th><th>Detalle</th><th class="text-end">Valor</th></tr></thead><tbody>
    ${m.length ? m.map((x) => `<tr><td>${fechaHora(x.fecha)}</td><td>${esc(x.descripcion)}</td>
      <td class="text-end ${x.valor >= 0 ? 'entra' : 'sale'}">${x.valor >= 0 ? '+' : '−'}${dinero(Math.abs(x.valor))}</td></tr>`).join('')
      : '<tr><td colspan="3" class="vacio">Sin movimientos.</td></tr>'}</tbody></table></div>${volver}`;
  enlazarVolver();
});

async function salir(texto) {
  try { await api('/api/cajero/logout', { method: 'POST' }); } catch { /* ignorar */ }
  sesionActiva = false; clearTimeout(inactividad);
  pantallaLogin(mensaje(texto, 'info'));
}

pantallaLogin();
</script>
</body>
</html>
